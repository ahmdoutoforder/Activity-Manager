<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Set your UniPlanner password</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#101827;--line:#243147;--text:#edf3ff;--muted:#8c9bb4;--blue:#7295ff;--mint:#62dfbd;--red:#ff7888}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,#24386666,transparent 45%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 18px 55px #0003}h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);line-height:1.6;font-size:13px}.field{margin:18px 0}.field label{display:block;margin-bottom:7px;font-size:13px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#141f31;color:var(--text);font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#081126;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}#message{min-height:22px;margin-top:14px;color:var(--muted);overflow-wrap:anywhere}.error{color:var(--red)!important}.success{color:var(--mint)!important}.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
<h1>Set your password</h1>
<p>Welcome to UniPlanner. Choose a password for your account. Your access to UniPlanner will remain pending until the owner approves it.</p>
<form id="passwordForm" class="hidden">
<div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again"></div>
<button class="btn" id="saveButton" type="submit">Save password</button>
</form>
<div id="message" role="status" aria-live="polite">Verifying your invitation link…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
'use strict';
const SUPABASE_URL='https://pulokexhjdxrmsdpcmid.supabase.co';
const SUPABASE_KEY='sb_publishable_uFZR3gFl-aA7WWu6fDKfFg_zXT-u24W';
const $=id=>document.getElementById(id),form=$('passwordForm'),message=$('message'),button=$('saveButton');
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const say=(text,kind='')=>{message.textContent=text;message.className=kind};
try{
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  if(hash.get('error')||query.get('error'))throw new Error(hash.get('error_description')||query.get('error_description')||'This invitation link is invalid or expired. Ask the owner to send a new invitation.');
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(!data.session)throw new Error('No valid invitation session was found. Open the latest invitation email link or ask the owner to resend it.');
  form.classList.remove('hidden');
  say('Invitation verified. Choose a password to continue.');
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    const password=$('password').value,confirmPassword=$('confirmPassword').value;
    if(password.length<8){say('Use a password with at least 8 characters.','error');return}
    if(password!==confirmPassword){say('The passwords do not match.','error');return}
    button.disabled=true;say('Saving your password…');
    try{
      const {error:updateError}=await client.auth.updateUser({password});
      if(updateError)throw updateError;
      say('Password saved! Your UniPlanner access is awaiting owner approval. Redirecting to sign in…','success');
      setTimeout(()=>location.replace('./index.html'),1800);
    }catch(err){say(err.message||'Could not save password. Open the latest invitation link and try again.','error');button.disabled=false}
  });
}catch(err){say(err.message||'Could not verify invitation.','error')}
})();
</script>
</body>
</html>
