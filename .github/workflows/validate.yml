name: Validate UniPlanner
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebuild/**"]
jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            const file = `/tmp/uniplanner-inline-${index}.js`;
            fs.writeFileSync(file, script);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          for (const marker of ['id="fullCalendar"', 'id="allTasks"', 'id="syncNowBtn"', 'id="timerStart"']) {
            if (!html.includes(marker)) throw new Error(`Missing required UI element: ${marker}`);
          }
          console.log(`Validated ${scripts.length} inline script(s) and core UI markers.`);
          NODE
