name: Validate UniPlanner
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebuild/**"]
jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (manifest.theme_color !== '#09070d') throw new Error('PWA theme color must match the obsidian product shell');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            const file = `/tmp/uniplanner-inline-${index}.js`;
            fs.writeFileSync(file, script);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          for (const marker of [
            'id="fullCalendar"',
            'id="allTasks"',
            'id="syncNowBtn"',
            'id="timerStart"',
            'id="dashAssignedWorkspaceTasks"',
            'id="assignedWorkspaceTasksList"',
            'id="dashboardAttendanceOverall"',
            'id="dashboardAttendanceClasses"',
            'id="dashboardAttendanceSessions"',
            'id="dashboardApprovedLeave"',
            'id="dashboardWorkspaceCard"',
            'timetable-day-group',
            'timetable-class-card',
            'id="dashboardTodayClasses"',
            'data-assigned-workspace-task',
            'async function renderWorkspaceActivity',
            'id = \'workspaceRecentActivity\'',
            "from('uniplanner_group_messages')",
            "from('uniplanner_task_comments')"
          ]) {
            if (!html.includes(marker)) throw new Error(`Missing required UI element/behavior marker: ${marker}`);
          }

          const sidebar = html.match(/<aside class="sidebar"[\s\S]*?<\/aside>/i)?.[0] || '';
          for (const page of ['dashboard', 'collaborate', 'attendance', 'tasks', 'timetable', 'calendar', 'settings']) {
            if (!sidebar.includes('data-page="' + page + '"')) throw new Error('Missing primary navigation page: ' + page);
          }
          for (const legacyPage of ['grades', 'faculty', 'focus', 'notes']) {
            if (sidebar.includes('data-page="' + legacyPage + '"')) throw new Error('Legacy page must not appear in primary navigation: ' + legacyPage);
          }
          const dashboardStart = html.indexOf('id="page-dashboard"');
          const dashboardEnd = html.indexOf('<section class="page" id="page-calendar"', dashboardStart);
          const dashboard = html.slice(dashboardStart, dashboardEnd);
          if (/data-goto="(?:grades|faculty|focus|notes)"/.test(dashboard)) throw new Error('Legacy destinations must not appear in dashboard quick actions');
          const workspaceCardIndex = html.indexOf('id="dashboardWorkspaceCard"', dashboardStart);
          const attentionIndex = html.indexOf('<section class="attention-panel"', dashboardStart);
          if (workspaceCardIndex < dashboardStart || attentionIndex < 0 || workspaceCardIndex > attentionIndex) {
            throw new Error('The shared-workspace card must appear before personal task attention on the dashboard');
          }

          const projectMigration = fs.readFileSync('workspace-project-task-link-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            'add column if not exists project_id uuid',
            'on delete set null',
            'new.project_id',
            'new.workspace_id'
          ]) {
            if (!projectMigration.includes(marker)) throw new Error(`Missing project-task migration safeguard: ${marker}`);
          }

          const assignmentUiMarkers = [
            'data-wtab="assignments"',
            "panel.id='workspaceAssignmentsPanel'",
            'ASSIGNMENT_FILE_BUCKET',
            'const upload=await storage.upload',
            '.storage.from(ASSIGNMENT_FILE_BUCKET).download',
            'upsert:false',
            'data-assignment-submit',
            'data-assignment-download'
          ];
          for (const marker of assignmentUiMarkers) {
            if (!html.includes(marker)) throw new Error(`Missing assignment UI behavior marker: ${marker}`);
          }

          const assignmentMigration = fs.readFileSync('workspace-assignments-storage-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            "insert into storage.buckets",
            "'uniplanner-workspace-files'",
            'public, file_size_limit, allowed_mime_types',
            '20971520',
            'create table if not exists public.uniplanner_assignments',
            'create table if not exists public.uniplanner_assignment_resources',
            'create table if not exists public.uniplanner_assignment_submissions',
            'alter table public.uniplanner_assignments enable row level security',
            'alter table public.uniplanner_assignment_resources enable row level security',
            'alter table public.uniplanner_assignment_submissions enable row level security',
            'on storage.objects for select',
            'on storage.objects for insert',
            'storage.foldername(name)',
            'submitted_by'
          ]) {
            if (!assignmentMigration.includes(marker)) throw new Error(`Missing assignment/storage migration safeguard: ${marker}`);
          }

          const assignmentIndexes = fs.readFileSync('workspace-assignment-indexes-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            'uniplanner_assignment_resources_assignment_id_idx',
            'uniplanner_assignment_resources_uploaded_by_idx',
            'uniplanner_assignment_submissions_assignment_id_idx',
            'uniplanner_assignments_created_by_idx'
          ]) {
            if (!assignmentIndexes.includes(marker)) throw new Error(`Missing assignment FK index: ${marker}`);
          }

          const submissionStatusMigration = fs.readFileSync('workspace-assignment-submission-status-migration.sql', 'utf8').toLowerCase();
          if (!submissionStatusMigration.includes("a.status = 'open'") ||
              !submissionStatusMigration.includes('on storage.objects for insert') ||
              !submissionStatusMigration.includes('on public.uniplanner_assignment_submissions for insert')) {
            throw new Error('Missing closed-assignment submission policy safeguards');
          }

          const cleanupWorkerMarkers = [
            'async function drainWorkspaceStorageCleanupJobs',
            "from('uniplanner_workspace_storage_cleanup_jobs')",
            'bucket.list(prefix',
            'bucket.remove(filePaths.slice',
            'loadWorkspacesBeforeStorageCleanup',
            '.range(offset,offset+cleanupPageSize-1)',
            'cleanupJobLimit=1000',
            'cleanupError=cleanup.error'
          ];
          for (const marker of cleanupWorkerMarkers) {
            if (!html.includes(marker)) throw new Error(`Missing workspace Storage cleanup behavior: ${marker}`);
          }

          const cleanupMigration = fs.readFileSync('workspace-storage-cleanup-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            'create table if not exists public.uniplanner_workspace_storage_cleanup_jobs',
            'after delete on public.uniplanner_workspaces',
            'for select to authenticated',
            'for delete to authenticated',
            'requested_by = (select auth.uid())',
            'on storage.objects for select',
            'on storage.objects for delete'
          ]) {
            if (!cleanupMigration.includes(marker)) throw new Error(`Missing workspace cleanup migration safeguard: ${marker}`);
          }

          console.log(`Validated ${scripts.length} inline script(s), workspace UI behavior, assignment/storage safeguards, and workspace cleanup worker.`);
          NODE

      - name: Check external JavaScript syntax
        run: node --check semester-upgrade.js

      - name: Test attendance independence and approved leave
        run: node tests/attendance-independence.test.js

      - name: Test workspace Storage cleanup worker
        run: node tests/workspace-storage-cleanup.test.js

      - name: Test workspace activity feed aggregation
        run: node tests/workspace-activity-feed.test.js

      - name: Test live workspace activity refresh
        run: node tests/workspace-realtime-refresh.test.js
