name: Validate UniPlanner
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebuild/**"]
jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            const file = `/tmp/uniplanner-inline-${index}.js`;
            fs.writeFileSync(file, script);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          for (const marker of [
            'id="fullCalendar"',
            'id="allTasks"',
            'id="syncNowBtn"',
            'id="timerStart"',
            'id="dashAssignedWorkspaceTasks"',
            'id="assignedWorkspaceTasksList"',
            'data-assigned-workspace-task'
          ]) {
            if (!html.includes(marker)) throw new Error(`Missing required UI element/behavior marker: ${marker}`);
          }

          const projectMigration = fs.readFileSync('workspace-project-task-link-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            'add column if not exists project_id uuid',
            'on delete set null',
            'new.project_id',
            'new.workspace_id'
          ]) {
            if (!projectMigration.includes(marker)) throw new Error(`Missing project-task migration safeguard: ${marker}`);
          }

          const assignmentUiMarkers = [
            'data-wtab="assignments"',
            "panel.id='workspaceAssignmentsPanel'",
            'ASSIGNMENT_FILE_BUCKET',
            'const upload=await storage.upload',
            '.storage.from(ASSIGNMENT_FILE_BUCKET).download',
            'upsert:false',
            'data-assignment-submit',
            'data-assignment-download'
          ];
          for (const marker of assignmentUiMarkers) {
            if (!html.includes(marker)) throw new Error(`Missing assignment UI behavior marker: ${marker}`);
          }

          const assignmentMigration = fs.readFileSync('workspace-assignments-storage-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            "insert into storage.buckets",
            "'uniplanner-workspace-files'",
            'public, file_size_limit, allowed_mime_types',
            '20971520',
            'create table if not exists public.uniplanner_assignments',
            'create table if not exists public.uniplanner_assignment_resources',
            'create table if not exists public.uniplanner_assignment_submissions',
            'alter table public.uniplanner_assignments enable row level security',
            'alter table public.uniplanner_assignment_resources enable row level security',
            'alter table public.uniplanner_assignment_submissions enable row level security',
            'on storage.objects for select',
            'on storage.objects for insert',
            'storage.foldername(name)',
            'submitted_by'
          ]) {
            if (!assignmentMigration.includes(marker)) throw new Error(`Missing assignment/storage migration safeguard: ${marker}`);
          }

          const assignmentIndexes = fs.readFileSync('workspace-assignment-indexes-migration.sql', 'utf8').toLowerCase();
          for (const marker of [
            'uniplanner_assignment_resources_assignment_id_idx',
            'uniplanner_assignment_resources_uploaded_by_idx',
            'uniplanner_assignment_submissions_assignment_id_idx',
            'uniplanner_assignments_created_by_idx'
          ]) {
            if (!assignmentIndexes.includes(marker)) throw new Error(`Missing assignment FK index: ${marker}`);
          }

          console.log(`Validated ${scripts.length} inline script(s), workspace UI behavior, and assignment/storage migration safeguards.`);
          NODE
